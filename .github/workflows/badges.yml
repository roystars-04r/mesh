name: Badges

on:
  push:
    branches: [main]
    # The badge commit only touches badges/**, so it must not retrigger this.
    paths-ignore:
      - "badges/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badges
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund
      - name: Measure coverage and write badge
        run: node scripts/badges.mjs
      - name: Commit badge if it changed
        run: |
          if git diff --quiet -- badges; then
            echo "Coverage unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges
          git commit -m "chore: update coverage badge [skip ci]"
          git pull --rebase --autostash origin main
          git push
