name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Run tests
        run: node --test test/*.test.ts
      - name: CLI smoke
        run: node dist/cli.js --version
