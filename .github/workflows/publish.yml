name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and test
        run: npm run check

      # --ignore-scripts: build/test already ran above, skip the prepublishOnly rerun.
      # --provenance: sign the tarball via GitHub OIDC (id-token: write above).
      # Trusted publishing: no NODE_AUTH_TOKEN. npm exchanges the GitHub OIDC token
      # for a short-lived credential, so the NPM_TOKEN secret is no longer used.
      - name: Publish with provenance
        run: npm publish --provenance --access public --ignore-scripts
